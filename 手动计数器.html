<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>手动计数器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        [hidden] {
            display: none !important;
        }

        body {
            min-height: 100vh;
            background-color: #f7f8fc;
            background-image:
                radial-gradient(900px circle at 8% -5%, #e0e7ff 0%, transparent 55%),
                radial-gradient(800px circle at 95% 5%, #fae8ff 0%, transparent 50%),
                radial-gradient(1000px circle at 50% 105%, #d1fae5 0%, transparent 55%);
            background-attachment: fixed;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            padding: 48px 24px 72px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .logo {
            flex: none;
            width: 48px;
            height: 48px;
            border-radius: 15px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 22px -8px rgba(99, 102, 241, 0.6);
            display: grid;
            place-items: center;
            color: #fff;
        }

        .logo svg {
            width: 24px;
            height: 24px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            color: #0f172a;
        }

        .subtitle {
            margin-top: 3px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .btn-add {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 999px;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 22px -8px rgba(99, 102, 241, 0.6);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            white-space: nowrap;
        }

        .btn-add svg {
            width: 18px;
            height: 18px;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -8px rgba(99, 102, 241, 0.65);
            filter: brightness(1.04);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .btn-add--ghost {
            background: #fff;
            color: #4f46e5;
            border: 1px solid #c7d2fe;
            box-shadow: none;
        }

        .btn-add--ghost:hover {
            background: #eef2ff;
            box-shadow: 0 10px 22px -14px rgba(99, 102, 241, 0.5);
        }

        .counter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }

        .counter-card {
            position: relative;
            background: #fff;
            border: 1px solid #e8ecf3;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 26px -16px rgba(15, 23, 42, 0.25);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            animation: card-in 0.25s ease-out;
        }

        .counter-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04), 0 18px 34px -18px rgba(15, 23, 42, 0.3);
        }

        .counter-card.active {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12), 0 18px 34px -18px rgba(15, 23, 42, 0.3);
        }

        .badge-active {
            position: absolute;
            top: -10px;
            right: 14px;
            padding: 3px 9px;
            border-radius: 999px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 10px -2px rgba(99, 102, 241, 0.5);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
        }

        .counter-card.active .badge-active {
            opacity: 1;
            transform: translateY(0);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-label {
            flex: 1;
            min-width: 0;
            border: 1px solid transparent;
            border-radius: 9px;
            background: transparent;
            padding: 6px 8px;
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card-label:hover {
            background: #f8fafc;
        }

        .card-label:focus {
            outline: none;
            background: #fff;
            border-color: #c7d2fe;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .card-label::placeholder {
            color: #b6c2d1;
            font-weight: 400;
        }

        .btn-delete {
            flex: none;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-delete:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .card-value {
            font-size: 3.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            text-align: center;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
            margin: 6px 0 2px;
            overflow-wrap: anywhere;
        }

        .counter-card.active .card-value {
            color: #4f46e5;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .card-actions button {
            flex: 1;
            border: none;
            border-radius: 11px;
            padding: 12px 0;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.18s, transform 0.18s, filter 0.18s;
        }

        .btn-minus {
            background: #fff1f2;
            color: #e11d48;
        }

        .btn-minus:hover {
            background: #ffe4e6;
        }

        .btn-plus {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #fff;
            box-shadow: 0 6px 14px -6px rgba(16, 185, 129, 0.55);
        }

        .btn-plus:hover {
            filter: brightness(1.04);
        }

        .card-actions button:active {
            transform: scale(0.97);
        }

        .btn-reset {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background: #fff;
            color: #64748b;
            padding: 8px 0;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .btn-reset:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #334155;
        }

        button:focus-visible {
            outline: 2px solid #6366f1;
            outline-offset: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 56px 20px;
            border: 2px dashed #e2e8f0;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.55);
        }

        .empty-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: #eef2ff;
            color: #6366f1;
            display: grid;
            place-items: center;
        }

        .empty-icon svg {
            width: 24px;
            height: 24px;
        }

        .empty-state p {
            margin-bottom: 16px;
            font-size: 0.98rem;
            color: #64748b;
        }

        .shortcuts {
            margin-top: 30px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 26px -20px rgba(15, 23, 42, 0.3);
        }

        .shortcuts h3 {
            margin-bottom: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #94a3b8;
        }

        .shortcut-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 24px;
        }

        .shortcut-list p {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: #475569;
        }

        kbd {
            min-width: 26px;
            padding: 2px 8px;
            border: 1px solid #e2e8f0;
            border-bottom-width: 2px;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            color: #334155;
            text-align: center;
        }

        .shortcuts .hint {
            margin-top: 12px;
            font-size: 0.82rem;
            color: #94a3b8;
        }

        .pulse {
            animation: pulse 0.32s ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            45% { transform: scale(1.07); }
            100% { transform: scale(1); }
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 640px) {
            .app {
                padding: 28px 16px 48px;
            }

            header {
                margin-bottom: 22px;
            }

            .logo {
                width: 42px;
                height: 42px;
                border-radius: 13px;
            }

            .logo svg {
                width: 21px;
                height: 21px;
            }

            h1 {
                font-size: 1.55rem;
            }

            .subtitle {
                font-size: 0.84rem;
            }

            .btn-add {
                width: 100%;
            }

            .counter-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }

            .counter-card {
                padding: 12px;
                gap: 8px;
                border-radius: 16px;
            }

            .card-label {
                font-size: 0.92rem;
                padding: 5px 6px;
            }

            .btn-delete {
                width: 26px;
                height: 26px;
            }

            .card-value {
                font-size: 2.4rem;
            }

            .card-actions button {
                padding: 10px 0;
                font-size: 0.98rem;
            }

            .btn-reset {
                padding: 7px 0;
            }

            .shortcuts {
                padding: 16px;
            }

            .shortcut-list {
                gap: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="brand">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </div>
                <div>
                    <h1>手动计数器</h1>
                    <p class="subtitle">一页管理多个计数器 · 数据自动保存在本地</p>
                </div>
            </div>
            <button class="btn-add" id="addBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                新增计数器
            </button>
        </header>

        <div class="counter-grid" id="counterGrid"></div>

        <div class="empty-state" id="emptyState" hidden>
            <div class="empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </div>
            <p>还没有任何计数器</p>
            <button class="btn-add btn-add--ghost" id="emptyAddBtn">新建一个</button>
        </div>

        <section class="shortcuts">
            <h3>快捷键</h3>
            <div class="shortcut-list">
                <p><kbd>空格</kbd>当前计数器 +1</p>
                <p><kbd>Backspace</kbd>当前计数器 -1</p>
                <p><kbd>R</kbd>重置当前计数器</p>
                <p><kbd>N</kbd>新增计数器</p>
            </div>
            <p class="hint">点击任意计数器卡片，即可将其设为当前计数器。</p>
        </section>
    </div>

    <script>
        (function () {
            const STORAGE_KEY = 'manualCounters';

            const grid = document.getElementById('counterGrid');
            const emptyState = document.getElementById('emptyState');
            const addBtn = document.getElementById('addBtn');
            const emptyAddBtn = document.getElementById('emptyAddBtn');

            // id -> { el, valueEl, labelInput }
            const cardRefs = new Map();

            let counters = loadCounters();
            let activeId = counters.length ? counters[0].id : null;

            addBtn.addEventListener('click', addCounter);
            emptyAddBtn.addEventListener('click', addCounter);
            document.addEventListener('keydown', handleShortcut);

            // 鼠标点击按钮后移除焦点，避免后续快捷键被按钮拦截
            document.addEventListener('click', function (e) {
                const btn = e.target.closest('button');
                if (btn && e.detail > 0) btn.blur();
            });

            render();

            function uid() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            }

            function loadCounters() {
                let raw = null;
                try {
                    raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
                } catch (err) {
                    raw = null;
                }

                if (!Array.isArray(raw)) {
                    return [{ id: uid(), label: '计数器 1', value: 0 }];
                }

                return raw
                    .filter(item => item && typeof item === 'object')
                    .map(item => ({
                        id: typeof item.id === 'string' && item.id ? item.id : uid(),
                        label: typeof item.label === 'string' ? item.label.slice(0, 30) : '',
                        value: Number.isFinite(item.value) ? Math.max(0, Math.trunc(item.value)) : 0
                    }));
            }

            function saveCounters() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(counters));
            }

            function render() {
                grid.innerHTML = '';
                cardRefs.clear();
                counters.forEach(counter => grid.appendChild(buildCard(counter)));
                refreshActive();
                refreshEmpty();
            }

            function buildCard(counter) {
                const card = document.createElement('div');
                card.className = 'counter-card';
                card.dataset.id = counter.id;
                card.innerHTML = `
                    <span class="badge-active">当前</span>
                    <div class="card-top">
                        <input type="text" class="card-label" maxlength="30" placeholder="未命名计数" aria-label="计数器名称">
                        <button class="btn-delete" title="删除计数器" aria-label="删除计数器">✕</button>
                    </div>
                    <div class="card-value">${counter.value}</div>
                    <div class="card-actions">
                        <button class="btn-minus" title="计数减 1">-1</button>
                        <button class="btn-plus" title="计数加 1">+1</button>
                    </div>
                    <button class="btn-reset" title="重置为 0">重置</button>
                `;

                const labelInput = card.querySelector('.card-label');
                const valueEl = card.querySelector('.card-value');
                labelInput.value = counter.label;

                cardRefs.set(counter.id, { el: card, valueEl, labelInput });

                card.addEventListener('click', () => setActive(counter.id));
                card.querySelector('.btn-plus').addEventListener('click', () => changeValue(counter.id, 1));
                card.querySelector('.btn-minus').addEventListener('click', () => changeValue(counter.id, -1));
                card.querySelector('.btn-reset').addEventListener('click', () => resetCounter(counter.id));
                card.querySelector('.btn-delete').addEventListener('click', e => {
                    e.stopPropagation();
                    deleteCounter(counter.id);
                });
                labelInput.addEventListener('input', () => {
                    counter.label = labelInput.value;
                    saveCounters();
                });

                return card;
            }

            function addCounter() {
                const counter = { id: uid(), label: '计数器 ' + (counters.length + 1), value: 0 };
                counters.push(counter);
                saveCounters();

                const card = buildCard(counter);
                grid.appendChild(card);

                setActive(counter.id);
                refreshEmpty();

                const ref = cardRefs.get(counter.id);
                ref.labelInput.focus();
                ref.labelInput.select();
            }

            function deleteCounter(id) {
                const index = counters.findIndex(c => c.id === id);
                if (index === -1) return;

                const counter = counters[index];
                const name = counter.label.trim() || '未命名计数';
                if (counter.value > 0 && !confirm(`确定删除「${name}」吗？当前计数值为 ${counter.value}。`)) {
                    return;
                }

                counters.splice(index, 1);
                const ref = cardRefs.get(id);
                if (ref) ref.el.remove();
                cardRefs.delete(id);

                if (activeId === id) {
                    activeId = counters.length ? counters[0].id : null;
                }

                saveCounters();
                refreshActive();
                refreshEmpty();
            }

            function changeValue(id, delta) {
                const counter = counters.find(c => c.id === id);
                if (!counter) return;

                counter.value = Math.max(0, counter.value + delta);
                setActive(id);
                renderValue(counter, true);
                saveCounters();
            }

            function resetCounter(id) {
                const counter = counters.find(c => c.id === id);
                if (!counter) return;

                setActive(id);
                if (counter.value === 0) return;

                counter.value = 0;
                renderValue(counter, true);
                saveCounters();
            }

            function renderValue(counter, animate) {
                const ref = cardRefs.get(counter.id);
                if (!ref) return;

                ref.valueEl.textContent = counter.value;
                if (animate) {
                    ref.valueEl.classList.remove('pulse');
                    void ref.valueEl.offsetWidth;
                    ref.valueEl.classList.add('pulse');
                }
            }

            function setActive(id) {
                activeId = id;
                refreshActive();
            }

            function refreshActive() {
                cardRefs.forEach((ref, id) => {
                    ref.el.classList.toggle('active', id === activeId);
                });
            }

            function refreshEmpty() {
                const isEmpty = counters.length === 0;
                grid.hidden = isEmpty;
                emptyState.hidden = !isEmpty;
            }

            function handleShortcut(e) {
                if (e.isComposing) return;

                const target = e.target;
                const tag = target && target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' ||
                    (target && target.isContentEditable)) {
                    return;
                }

                if (e.ctrlKey || e.metaKey || e.altKey) return;

                switch (e.key) {
                    case ' ':
                    case 'Spacebar':
                        e.preventDefault();
                        if (activeId) changeValue(activeId, 1);
                        break;
                    case 'Backspace':
                        e.preventDefault();
                        if (activeId) changeValue(activeId, -1);
                        break;
                    case 'r':
                    case 'R':
                        if (activeId) resetCounter(activeId);
                        break;
                    case 'n':
                    case 'N':
                        e.preventDefault();
                        addCounter();
                        break;
                }
            }
        })();
    </script>
</body>
</html>
